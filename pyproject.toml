[project]
name = "invoice-scrapper"
version = "0.1.0"
description = "Desktop app to scrape PDF invoices and export to Excel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "flet==0.84.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "pytesseract>=0.3.10",
    "img2table>=1.2.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
