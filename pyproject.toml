[project]
name = "invoice-scrapper"
version = "0.1.0"
description = "Desktop app to scrape PDF invoices and export to Excel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "flet==0.84.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
    "python-semantic-release>=9.8.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.semantic_release]
branch = "main"
changelog_file = "CHANGELOG.md"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["invoice_scrapper/__init__.py:__version__"]
build_command = "echo 'No build step for semantic-release'"
upload_to_pypi = false
upload_to_release = true

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

